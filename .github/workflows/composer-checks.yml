name: Application and device checks
on:
  pull_request:
    paths: ['frontend/**', 'backend/**', 'agent/**', '.github/workflows/composer-checks.yml']
  push:
    branches: [main]
    paths: ['frontend/**', 'backend/**', 'agent/**', '.github/workflows/composer-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: npm run build --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix backend
      - run: node --test backend/tests/*.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            agent/factory/requirements.txt
            agent/streamdeck/requirements.txt
      - run: pip install -r agent/factory/requirements.txt -r agent/streamdeck/requirements.txt
      - run: python -m unittest discover -s agent/tests -p 'test_*.py'
      - run: python -m unittest discover -s agent/streamdeck -p 'test_*.py'
