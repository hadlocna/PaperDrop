name: Composer checks
on:
  pull_request:
    paths: ['frontend/**', 'backend/**', '.github/workflows/composer-checks.yml']
  push:
    branches: [main]
    paths: ['frontend/**', 'backend/**', '.github/workflows/composer-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: npm run build --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix backend
      - run: node --test backend/tests/*.test.cjs
